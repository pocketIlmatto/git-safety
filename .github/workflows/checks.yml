name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (Gitleaks ${{ matrix.gitleaks }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - gitleaks: '8.29.1'
            sha256: e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924
          - gitleaks: '8.30.1'
            sha256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out all history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install test and scanner dependencies
        shell: bash
        env:
          GITLEAKS_VERSION: ${{ matrix.gitleaks }}
          GITLEAKS_SHA256: ${{ matrix.sha256 }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes python3 ripgrep
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          scratch="$(mktemp -d "${RUNNER_TEMP:?}/gitleaks.XXXXXX")"
          trap 'rm -rf "$scratch"' EXIT
          curl --fail --location --retry 3 --output "$scratch/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          (cd "$scratch" && printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict)
          tar --extract --gzip --file "$scratch/$archive" --directory "$scratch" gitleaks
          mkdir -p "$RUNNER_TEMP/git-safety-bin"
          install -m 0755 "$scratch/gitleaks" "$RUNNER_TEMP/git-safety-bin/gitleaks"
          echo "$RUNNER_TEMP/git-safety-bin" >> "$GITHUB_PATH"
      - name: Toolkit regression tests
        if: matrix.gitleaks == '8.30.1'
        run: ./scripts/check
      - name: Minimum-version integration tests
        if: matrix.gitleaks == '8.29.1'
        run: python3 -B -m unittest tests.test_secrets tests.test_cli -v
      - name: Full privacy and credential scans
        run: ./bin/git-safety all
